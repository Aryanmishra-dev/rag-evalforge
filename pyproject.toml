[tool.pylint]
# Make `src.*` resolvable no matter how pylint is invoked (single file or the
# full `pylint $(git ls-files '*.py')` gate from any repo-relative cwd).
init-hook = "import sys, pathlib; sys.path.insert(0, str(pathlib.Path('.').resolve()))"

[tool.pylint."messages control"]
# The CLI scripts, Streamlit app, and MCP server insert their project root
# onto sys.path so they can be run directly (e.g.
# `python src/ingestion/ingest.py`) before importing `src.*`. Those imports
# are intentionally positioned after the sys.path line, so the positional
# check is disabled project-wide.
#
# Single-method classes are an intentional design pattern here: the reranker
# strategy objects and pytest fixture fakes each expose exactly one public
# method, so the "too few public methods" refactoring hint is disabled.
#
# Protocol method bodies keep an ellipsis even though a docstring already
# forms a valid body: pyright treats an ellipsis-only body as an abstract
# stub, so removing it would break the type check for `Reranker.rerank`.
disable = [
    "wrong-import-position",
    "too-few-public-methods",
    "unnecessary-ellipsis",
]

[tool.pylint.design]
# BM25Index keeps eight small state fields (k1/b tuning knobs plus the posting
# tables); the default cap of seven is too tight for a well-factored index.
max-attributes = 10

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", ".git", "data", "__pycache__", ".pytest_cache", "docker"]

[tool.ruff.lint]
# Production-grade rule set: Pyflakes + pycodestyle (E/F), isort (I),
# pyupgrade (UP), bugbear (B), simplify (SIM), comprehensions (C4), and
# Ruff-specific lints (RUF). E501 is delegated to `ruff format`.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",
    # Test method names are intentionally verbose; fixtures assert on each other.
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
# mcp_server.py chdirs to the repo root and inserts it on sys.path before
# importing `src.*` so `.env` and relative data paths resolve when the process
# is launched by an MCP client from an arbitrary cwd (same pattern as pylint's
# `wrong-import-position` disable above).
"src/mcp_server.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
